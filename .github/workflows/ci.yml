# Checks every pull request: lint, types and a production build.
name: CI

on:
  pull_request:
    branches: [dev, stg, main]
  push:
    branches: [dev, stg, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Build
        run: npm run build
